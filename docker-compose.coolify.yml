services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Coolify connects every public service to its shared proxy network.
      # The private alias prevents this frontend from resolving an `api`
      # container belonging to a different Coolify application.
      API_INTERNAL_URL: http://vivat-api:8080
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - coolify
      - vivat-internal
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # Coolify scopes named volumes per application. Mount the verified
      # production data directory explicitly so the migration always uses
      # the existing Vivat database rather than creating an empty volume.
      - /var/lib/docker/volumes/vivat_postgres_data/_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      vivat-internal:
        aliases:
          - vivat-postgres

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - /var/lib/docker/volumes/vivat_redis_data/_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      vivat-internal:
        aliases:
          - vivat-redis

  migrate:
    image: migrate/migrate:v4.18.3
    # The production volume is already at the latest migration. Run this
    # explicitly with --profile maintenance when a new migration is added.
    profiles: ["maintenance"]
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "${DATABASE_URL:?DATABASE_URL is required}",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - vivat-internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vivat.wtmelon.store}
      SAAS_CONTROL_SECRET: ${SAAS_CONTROL_SECRET:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:?BOOTSTRAP_OWNER_EMAIL is required}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:?BOOTSTRAP_OWNER_PASSWORD is required}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-vivat-bus}
      BOOTSTRAP_OWNER_RESET_PASSWORD: "false"
      SEED_DEMO_DATA: "false"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      vivat-internal:
        aliases:
          - vivat-api

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        COMMAND: bot
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TENANT_SLUG: ${BOT_TENANT_SLUG:-vivat-bus}
      TELEGRAM_BOTS_JSON: ${TELEGRAM_BOTS_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vivat-internal

networks:
  # Only the web service is exposed to Coolify's shared Traefik network.
  coolify:
    external: true
  vivat-internal:
    internal: true
