<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f1f1b">
    <link rel="icon" href="data:,">
    <title>Нет соединения — Vivat Bus</title>
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: dark; background: #10100e; color: #fafaf7; font: 16px/1.6 system-ui, sans-serif; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 400px); padding: 28px; background: #23231e; border: 1px solid #393930; border-radius: 16px; }
      .brand { margin: 0; font-weight: 700; }
      h1 { margin: 32px 0 12px; font-size: 28px; line-height: 1.2; letter-spacing: -.02em; }
      p { color: #d0cbb9; margin: 12px 0; }
      a { display: flex; justify-content: center; align-items: center; min-height: 48px; margin-top: 28px; padding: 10px 16px; border-radius: 12px; background: #e9b74d; color: #191914; font-weight: 700; text-decoration: none; text-align: center; }
      a:hover { background: #f2c665; }
      a:focus-visible { outline: 3px solid #fafaf7; outline-offset: 4px; }
      ::selection { background: #e9b74d; color: #191914; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Vivat Bus</p>
      <h1>Нет соединения</h1>
      <p>Проверьте интернет и откройте приложение снова. Данные компании станут доступны после восстановления соединения.</p>
      <a href="/">Открыть приложение</a>
    </main>
  </body>
</html>
