services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping']

  api:
    ports: !reset []
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}@redis:6379/0
      CORS_ORIGIN: https://${VIVAT_DOMAIN:-vivat.wtmelon.store}
      WS_ALLOWED_ORIGINS: https://${VIVAT_DOMAIN:-vivat.wtmelon.store}

  bot:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}@redis:6379/0

  web:
    build:
      args:
        API_INTERNAL_URL: http://vivat-api:8080
    environment:
      API_INTERNAL_URL: http://vivat-api:8080
      APP_ORIGIN: https://${VIVAT_DOMAIN:-vivat.wtmelon.store}
    networks:
      - default
      - coolify
    labels:
      caddy_0: https://vivat.wtmelon.store
      caddy_0.encode: zstd gzip
      caddy_0.handle_path: /*
      caddy_0.handle_path.0_reverse_proxy: "{{upstreams 3000}}"
      caddy_0.header: -Server
      caddy_ingress_network: coolify
      traefik.enable: "true"
      traefik.http.middlewares.vivat-gzip.compress: "true"
      traefik.http.middlewares.vivat-https.redirectscheme.scheme: https
      traefik.http.routers.vivat-http.entryPoints: http
      traefik.http.routers.vivat-http.middlewares: vivat-https
      traefik.http.routers.vivat-http.rule: "Host(`vivat.wtmelon.store`) && PathPrefix(`/`)"
      traefik.http.routers.vivat-http.service: vivat-http
      traefik.http.routers.vivat-https.entryPoints: https
      traefik.http.routers.vivat-https.middlewares: vivat-gzip
      traefik.http.routers.vivat-https.rule: "Host(`vivat.wtmelon.store`) && PathPrefix(`/`)"
      traefik.http.routers.vivat-https.service: vivat-https
      traefik.http.routers.vivat-https.tls: "true"
      traefik.http.routers.vivat-https.tls.certresolver: letsencrypt
      traefik.http.services.vivat-http.loadbalancer.server.port: "3000"
      traefik.http.services.vivat-https.loadbalancer.server.port: "3000"

networks:
  coolify:
    external: true
