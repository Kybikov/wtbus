name: Manual SSH deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivat-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_USER; do
            if [ -z "${!name}" ]; then
              missing="${missing}${missing:+, }${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Production configuration incomplete::Missing GitHub Environment secrets: $missing"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate web application
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate Go services
        working-directory: backend
        run: |
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Validate Docker Compose manifests
        run: |
          docker compose config --quiet
          docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
          docker compose --env-file .env.production.example -f docker-compose.production.yml -f docker-compose.vps.yml config --quiet

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Synchronize source and start Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_USER"
          prepare_command=$(printf 'mkdir -p %q' "$DEPLOY_PATH")
          if ! printf '%s\n' "$prepare_command" | ssh "$DEPLOY_USER@$DEPLOY_HOST" sh -s; then
            echo "::error title=Production synchronization failed::ssh-or-deploy-path-unavailable"
            exit 1
          fi
          set +e
          sync_output=$(rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/" 2>&1)
          sync_status=$?
          set -e
          if [ "$sync_status" -ne 0 ]; then
            case "$sync_output" in
              *"Permission denied"*) category="deploy-path-permission-denied" ;;
              *"No such file or directory"*) category="deploy-path-missing" ;;
              *"Host key verification failed"*) category="ssh-host-key-rejected" ;;
              *"Connection refused"*|*"Connection timed out"*) category="ssh-host-unreachable" ;;
              *"No space left on device"*) category="server-disk-full" ;;
              *) category="unclassified-rsync-error" ;;
            esac
            echo "::error title=Production synchronization failed::$category"
            exit "$sync_status"
          fi
          remote_command=$(printf 'cd %q && docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.vps.yml --profile bot up -d --build --remove-orphans' "$DEPLOY_PATH")
          set +e
          deploy_output=$(printf '%s\n' "$remote_command" | ssh "$DEPLOY_USER@$DEPLOY_HOST" sh -s 2>&1)
          deploy_status=$?
          set -e
          printf '%s\n' "$deploy_output"
          if [ "$deploy_status" -ne 0 ]; then
            case "$deploy_output" in
              *"network coolify declared as external"*) category="missing-coolify-network" ;;
              *"Conflict. The container name"*) category="container-name-conflict" ;;
              *"port is already allocated"*|*"address already in use"*) category="host-port-conflict" ;;
              *"service \"migrate\" didn't complete successfully"*|*"Dirty database version"*) category="database-migration-failed" ;;
              *"permission denied"*) category="docker-permission-denied" ;;
              *"no space left on device"*) category="server-disk-full" ;;
              *"failed to solve"*|*"process did not complete successfully"*) category="image-build-failed" ;;
              *"manifest unknown"*|*"pull access denied"*) category="image-pull-failed" ;;
              *"unknown flag"*|*"unsupported"*) category="compose-version-incompatible" ;;
              *"is not set"*|*"required variable"*) category="production-environment-incomplete" ;;
              *) category="unclassified-server-error" ;;
            esac
            echo "::error title=Production deployment failed::$category"
            exit "$deploy_status"
          fi
